services:
  - type: web
    name: family-shop-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard (Neon/Supabase connection string)
      - key: CORS_ORIGINS
        sync: false   # e.g. https://your-app.vercel.app
